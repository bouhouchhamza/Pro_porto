<svg width="600" height="340" viewBox="0 0 600 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="soc_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a081f"/>
      <stop offset="50%" stop-color="#141033"/>
      <stop offset="100%" stop-color="#070514"/>
    </linearGradient>
    <linearGradient id="soc_card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1845" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f0c26" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="600" height="340" fill="url(#soc_bg)"/>

  <!-- Network Interconnection Grid -->
  <g opacity="0.08" stroke="#a855f7" stroke-width="1">
    <circle cx="200" cy="170" r="100"/>
    <circle cx="400" cy="170" r="100"/>
    <line x1="100" y1="170" x2="500" y2="170"/>
  </g>

  <!-- Frame -->
  <rect x="110" y="52" width="380" height="236" rx="14" fill="url(#soc_card)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1.5"/>

  <path d="M110 92 H490" stroke="rgba(168, 85, 247, 0.2)" stroke-width="1"/>
  <circle cx="135" cy="72" r="4" fill="#a855f7"/>
  <circle cx="150" cy="72" r="4" fill="#6366f1"/>
  <circle cx="165" cy="72" r="4" fill="#38bdf8"/>

  <!-- Network Community & Feed Nodes Motif -->
  <g transform="translate(180, 120)">
    <!-- Central Node -->
    <circle cx="120" cy="45" r="24" fill="rgba(15, 23, 42, 0.9)" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="120" cy="45" r="10" fill="#c084fc"/>

    <!-- Satellites -->
    <circle cx="40" cy="20" r="16" fill="rgba(15, 23, 42, 0.9)" stroke="#6366f1" stroke-width="1.2"/>
    <circle cx="40" cy="20" r="6" fill="#818cf8"/>

    <circle cx="50" cy="75" r="14" fill="rgba(15, 23, 42, 0.9)" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="50" cy="75" r="5" fill="#38bdf8"/>

    <circle cx="200" cy="20" r="15" fill="rgba(15, 23, 42, 0.9)" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="200" cy="20" r="5" fill="#38bdf8"/>

    <circle cx="190" cy="75" r="17" fill="rgba(15, 23, 42, 0.9)" stroke="#4ade80" stroke-width="1.2"/>
    <circle cx="190" cy="75" r="6" fill="#4ade80"/>

    <!-- Connectors -->
    <line x1="56" y1="25" x2="98" y2="39" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="64" y1="70" x2="100" y2="54" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="142" y1="39" x2="185" y2="25" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="140" y1="52" x2="173" y2="70" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(180, 250)">
    <rect x="0" y="0" width="85" height="22" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1"/>
    <text x="42" y="15" text-anchor="middle" fill="#e9d5ff" font-family="'Questrial', sans-serif" font-size="10" font-weight="500">COMMUNITY</text>

    <rect x="95" y="0" width="75" height="22" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(99, 102, 241, 0.35)" stroke-width="1"/>
    <text x="132" y="15" text-anchor="middle" fill="#c7d2fe" font-family="'Questrial', sans-serif" font-size="10" font-weight="500">NETWORK</text>

    <rect x="180" y="0" width="60" height="22" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1"/>
    <text x="210" y="15" text-anchor="middle" fill="#bae6fd" font-family="'Questrial', sans-serif" font-size="10" font-weight="500">SYNC</text>
  </g>
</svg>
