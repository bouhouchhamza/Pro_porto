<svg width="600" height="340" viewBox="0 0 600 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ai_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0618"/>
      <stop offset="50%" stop-color="#180a29"/>
      <stop offset="100%" stop-color="#08020f"/>
    </linearGradient>
    <linearGradient id="ai_card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#281140" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#140621" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="ai_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="600" height="340" fill="url(#ai_bg)"/>

  <!-- Neural Mesh Grid -->
  <g opacity="0.08" stroke="#c084fc" stroke-width="1">
    <polygon points="150,80 250,50 350,90 450,60 550,110"/>
    <polygon points="100,180 220,160 320,200 420,170 520,210"/>
    <polygon points="140,280 260,250 360,290 460,260 540,300"/>
    <line x1="220" y1="160" x2="250" y2="50"/>
    <line x1="320" y1="200" x2="350" y2="90"/>
    <line x1="420" y1="170" x2="450" y2="60"/>
  </g>

  <rect x="110" y="52" width="380" height="236" rx="14" fill="url(#ai_card)" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1.5"/>

  <path d="M110 92 H490" stroke="rgba(192, 132, 252, 0.2)" stroke-width="1"/>
  <circle cx="135" cy="72" r="4" fill="#c084fc"/>
  <circle cx="150" cy="72" r="4" fill="#f43f5e"/>
  <circle cx="165" cy="72" r="4" fill="#38bdf8"/>

  <!-- Neural Automation & Pipeline Nodes -->
  <g transform="translate(160, 115)">
    <!-- Input Nodes -->
    <circle cx="20" cy="20" r="12" fill="rgba(15, 23, 42, 0.9)" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="20" cy="20" r="4" fill="#38bdf8"/>

    <circle cx="20" cy="55" r="12" fill="rgba(15, 23, 42, 0.9)" stroke="#818cf8" stroke-width="1.2"/>
    <circle cx="20" cy="55" r="4" fill="#818cf8"/>

    <circle cx="20" cy="90" r="12" fill="rgba(15, 23, 42, 0.9)" stroke="#c084fc" stroke-width="1.2"/>
    <circle cx="20" cy="90" r="4" fill="#c084fc"/>

    <!-- Hidden Transform Engine -->
    <rect x="90" y="15" width="100" height="80" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.5"/>
    <circle cx="140" cy="45" r="18" fill="rgba(192, 132, 252, 0.2)" stroke="url(#ai_grad)" stroke-width="2"/>
    <circle cx="140" cy="45" r="6" fill="#f43f5e"/>
    <rect x="105" y="75" width="70" height="5" rx="2.5" fill="rgba(255, 255, 255, 0.5)"/>

    <!-- Output Synthesizer -->
    <circle cx="250" cy="35" r="14" fill="rgba(15, 23, 42, 0.9)" stroke="#4ade80" stroke-width="1.2"/>
    <circle cx="250" cy="35" r="5" fill="#4ade80"/>

    <circle cx="250" cy="75" r="14" fill="rgba(15, 23, 42, 0.9)" stroke="#fbbf24" stroke-width="1.2"/>
    <circle cx="250" cy="75" r="5" fill="#fbbf24"/>

    <!-- Connector Vectors -->
    <line x1="32" y1="20" x2="90" y2="40" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line x1="32" y1="55" x2="90" y2="55" stroke="#818cf8" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line x1="32" y1="90" x2="90" y2="70" stroke="#c084fc" stroke-width="1.2" stroke-dasharray="3 3"/>

    <line x1="190" y1="45" x2="236" y2="35" stroke="#4ade80" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line x1="190" y1="65" x2="236" y2="75" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="3 3"/>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(160, 250)">
    <rect x="0" y="0" width="85" height="22" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(192, 132, 252, 0.35)" stroke-width="1"/>
    <text x="42" y="15" text-anchor="middle" fill="#f3e8ff" font-family="'Questrial', sans-serif" font-size="10" font-weight="500">AUTOMATION</text>

    <rect x="95" y="0" width="70" height="22" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(244, 63, 94, 0.35)" stroke-width="1"/>
    <text x="130" y="15" text-anchor="middle" fill="#fecdd3" font-family="'Questrial', sans-serif" font-size="10" font-weight="500">PIPELINE</text>

    <rect x="175" y="0" width="60" height="22" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1"/>
    <text x="205" y="15" text-anchor="middle" fill="#bae6fd" font-family="'Questrial', sans-serif" font-size="10" font-weight="500">WORKFLOW</text>
  </g>
</svg>
