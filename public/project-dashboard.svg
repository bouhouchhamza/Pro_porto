<svg width="600" height="340" viewBox="0 0 600 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="db_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1f"/>
      <stop offset="50%" stop-color="#121233"/>
      <stop offset="100%" stop-color="#070714"/>
    </linearGradient>
    <linearGradient id="db_card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1a40" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f0e26" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="db_line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="600" height="340" fill="url(#db_bg)"/>

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <path d="M0 60 H600 M0 120 H600 M0 180 H600 M0 240 H600 M0 300 H600"/>
    <path d="M60 0 V340 M120 0 V340 M180 0 V340 M240 0 V340 M300 0 V340 M360 0 V340 M420 0 V340 M480 0 V340 M540 0 V340"/>
  </g>

  <!-- Abstract System Dashboard Frame -->
  <rect x="110" y="52" width="380" height="236" rx="14" fill="url(#db_card)" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1.5"/>

  <!-- Top Frame Bar -->
  <path d="M110 92 H490" stroke="rgba(139, 92, 246, 0.2)" stroke-width="1"/>
  <circle cx="135" cy="72" r="4" fill="#818cf8"/>
  <circle cx="150" cy="72" r="4" fill="#c084fc"/>
  <circle cx="165" cy="72" r="4" fill="#38bdf8"/>
  <rect x="360" y="67" width="105" height="10" rx="5" fill="rgba(139, 92, 246, 0.2)"/>

  <!-- Left: Analytical Metric Gauges -->
  <g transform="translate(140, 116)">
    <rect x="0" y="0" width="135" height="100" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(139, 92, 246, 0.25)" stroke-width="1"/>
    <rect x="14" y="16" width="55" height="5" rx="2.5" fill="rgba(255, 255, 255, 0.7)"/>
    <rect x="14" y="28" width="85" height="4" rx="2" fill="rgba(255, 255, 255, 0.3)"/>
    
    <!-- Vector Graph Curve -->
    <path d="M14 74 Q 45 42, 70 60 T 120 40" stroke="url(#db_line)" stroke-width="2" fill="none"/>
    <circle cx="45" cy="52" r="3" fill="#818cf8"/>
    <circle cx="70" cy="60" r="3" fill="#c084fc"/>
    <circle cx="120" cy="40" r="3" fill="#38bdf8"/>
  </g>

  <!-- Right: System Module Blocks -->
  <g transform="translate(295, 116)">
    <rect x="0" y="0" width="170" height="44" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
    <circle cx="20" cy="22" r="6" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-width="1.2"/>
    <rect x="36" y="16" width="70" height="5" rx="2.5" fill="rgba(255, 255, 255, 0.7)"/>
    <rect x="36" y="26" width="45" height="4" rx="2" fill="rgba(255, 255, 255, 0.35)"/>
    <rect x="125" y="17" width="30" height="10" rx="5" fill="rgba(56, 189, 248, 0.2)"/>

    <rect x="0" y="56" width="170" height="44" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(168, 85, 247, 0.25)" stroke-width="1"/>
    <circle cx="20" cy="78" r="6" fill="rgba(168, 85, 247, 0.2)" stroke="#a855f7" stroke-width="1.2"/>
    <rect x="36" y="72" width="65" height="5" rx="2.5" fill="rgba(255, 255, 255, 0.7)"/>
    <rect x="36" y="82" width="50" height="4" rx="2" fill="rgba(255, 255, 255, 0.35)"/>
    <rect x="125" y="73" width="30" height="10" rx="5" fill="rgba(168, 85, 247, 0.2)"/>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(150, 250)">
    <rect x="0" y="0" width="85" height="22" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(139, 92, 246, 0.35)" stroke-width="1"/>
    <text x="42" y="15" text-anchor="middle" fill="#ddd6fe" font-family="'Questrial', sans-serif" font-size="10" font-weight="500">BACKEND</text>

    <rect x="95" y="0" width="75" height="22" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1"/>
    <text x="132" y="15" text-anchor="middle" fill="#bae6fd" font-family="'Questrial', sans-serif" font-size="10" font-weight="500">SYSTEM</text>

    <rect x="180" y="0" width="65" height="22" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(74, 222, 128, 0.35)" stroke-width="1"/>
    <text x="212" y="15" text-anchor="middle" fill="#bbf7d0" font-family="'Questrial', sans-serif" font-size="10" font-weight="500">API</text>
  </g>
</svg>
