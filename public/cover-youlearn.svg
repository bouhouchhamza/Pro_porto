<svg width="600" height="340" viewBox="0 0 600 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Cosmic Gradients -->
    <linearGradient id="yl_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0724"/>
      <stop offset="50%" stop-color="#160e3b"/>
      <stop offset="100%" stop-color="#080417"/>
    </linearGradient>
    <linearGradient id="yl_card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#231754" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#130b30" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="yl_glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="600" height="340" fill="url(#yl_bg)"/>
  <rect width="600" height="340" fill="url(#yl_glow)"/>

  <!-- Subtle Blueprint Grid Pattern -->
  <g opacity="0.07" stroke="#a855f7" stroke-width="1">
    <path d="M0 60 H600 M0 120 H600 M0 180 H600 M0 240 H600 M0 300 H600"/>
    <path d="M60 0 V340 M120 0 V340 M180 0 V340 M240 0 V340 M300 0 V340 M360 0 V340 M420 0 V340 M480 0 V340 M540 0 V340"/>
  </g>

  <!-- Central LMS & REST Architecture Frame -->
  <rect x="110" y="52" width="380" height="236" rx="14" fill="url(#yl_card)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1.5"/>

  <!-- Top System Bar -->
  <path d="M110 92 H490" stroke="rgba(168, 85, 247, 0.2)" stroke-width="1"/>
  <circle cx="135" cy="72" r="4" fill="#a855f7"/>
  <circle cx="150" cy="72" r="4" fill="#818cf8"/>
  <circle cx="165" cy="72" r="4" fill="#fbbf24"/>
  <rect x="360" y="67" width="105" height="10" rx="5" fill="rgba(168, 85, 247, 0.2)"/>

  <!-- Left: Modular Curriculum & Learning Hierarchy Tree -->
  <g transform="translate(145, 116)">
    <!-- Root Course Node -->
    <rect x="0" y="30" width="75" height="32" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="#a855f7" stroke-width="1.2"/>
    <circle cx="14" cy="46" r="4" fill="#fbbf24"/>
    <rect x="25" y="44" width="40" height="4" rx="2" fill="rgba(255, 255, 255, 0.8)"/>

    <!-- Branch Connector Vectors -->
    <path d="M75 46 C 95 46, 95 18, 110 18" stroke="#818cf8" stroke-width="1.5" fill="none"/>
    <path d="M75 46 C 95 46, 95 74, 110 74" stroke="#818cf8" stroke-width="1.5" fill="none"/>

    <!-- Module Node 1 -->
    <rect x="110" y="2" width="70" height="32" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="#818cf8" stroke-width="1"/>
    <circle cx="122" cy="18" r="3.5" fill="#4ade80"/>
    <rect x="132" y="16" width="36" height="4" rx="2" fill="rgba(255, 255, 255, 0.7)"/>

    <!-- Module Node 2 -->
    <rect x="110" y="58" width="70" height="32" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="#818cf8" stroke-width="1"/>
    <circle cx="122" cy="74" r="3.5" fill="#38bdf8"/>
    <rect x="132" y="72" width="36" height="4" rx="2" fill="rgba(255, 255, 255, 0.7)"/>

    <text x="75" y="108" text-anchor="middle" fill="#e9d5ff" font-family="'Questrial', sans-serif" font-size="9" letter-spacing="0.04em">CURRICULUM TREE</text>
  </g>

  <!-- Right: REST API Endpoints & JWT Security Schema Motif -->
  <g transform="translate(350, 116)">
    <!-- API Terminal Block -->
    <rect x="0" y="0" width="120" height="96" rx="8" fill="rgba(10, 6, 26, 0.85)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1"/>

    <!-- Endpoint Item 1: POST /auth/login -->
    <rect x="10" y="12" width="28" height="12" rx="3" fill="rgba(168, 85, 247, 0.25)" stroke="#a855f7" stroke-width="0.8"/>
    <text x="24" y="21" text-anchor="middle" fill="#e9d5ff" font-family="monospace" font-size="7" font-weight="700">POST</text>
    <rect x="44" y="16" width="62" height="4" rx="2" fill="rgba(255, 255, 255, 0.5)"/>

    <!-- Endpoint Item 2: GET /courses -->
    <rect x="10" y="32" width="24" height="12" rx="3" fill="rgba(56, 189, 248, 0.25)" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="22" y="41" text-anchor="middle" fill="#bae6fd" font-family="monospace" font-size="7" font-weight="700">GET</text>
    <rect x="40" y="36" width="66" height="4" rx="2" fill="rgba(255, 255, 255, 0.5)"/>

    <!-- Endpoint Item 3: PUT /progress -->
    <rect x="10" y="52" width="24" height="12" rx="3" fill="rgba(74, 222, 128, 0.25)" stroke="#4ade80" stroke-width="0.8"/>
    <text x="22" y="61" text-anchor="middle" fill="#bbf7d0" font-family="monospace" font-size="7" font-weight="700">PUT</text>
    <rect x="40" y="56" width="56" height="4" rx="2" fill="rgba(255, 255, 255, 0.5)"/>

    <!-- JWT Token Shield -->
    <g transform="translate(10, 72)">
      <rect x="0" y="0" width="100" height="15" rx="4" fill="rgba(251, 191, 36, 0.15)" stroke="rgba(251, 191, 36, 0.4)" stroke-width="0.8"/>
      <circle cx="8" cy="7.5" r="2.5" fill="#fbbf24"/>
      <text x="16" y="11" fill="#fef08a" font-family="'Questrial', sans-serif" font-size="8" font-weight="600">JWT AUTH &amp; ROLES</text>
    </g>

    <text x="60" y="108" text-anchor="middle" fill="#fef08a" font-family="'Questrial', sans-serif" font-size="9" letter-spacing="0.04em">RESTFUL API</text>
  </g>

  <!-- Bottom Architecture Node Badges: Node.js / Express / MongoDB / Mongoose -->
  <g transform="translate(145, 250)">
    <rect x="0" y="0" width="70" height="22" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(74, 222, 128, 0.35)" stroke-width="1"/>
    <circle cx="12" cy="11" r="3" fill="#4ade80"/>
    <text x="22" y="15" fill="#bbf7d0" font-family="'Questrial', sans-serif" font-size="10" font-weight="500">NODE.JS</text>

    <rect x="80" y="0" width="75" height="22" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1"/>
    <circle cx="92" cy="11" r="3" fill="#a855f7"/>
    <text x="102" y="15" fill="#e9d5ff" font-family="'Questrial', sans-serif" font-size="10" font-weight="500">EXPRESS</text>

    <rect x="165" y="0" width="80" height="22" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1"/>
    <circle cx="177" cy="11" r="3" fill="#38bdf8"/>
    <text x="187" y="15" fill="#bae6fd" font-family="'Questrial', sans-serif" font-size="10" font-weight="500">MONGODB</text>

    <rect x="255" y="0" width="55" height="22" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(251, 191, 36, 0.35)" stroke-width="1"/>
    <circle cx="267" cy="11" r="3" fill="#fbbf24"/>
    <text x="277" y="15" fill="#fef08a" font-family="'Questrial', sans-serif" font-size="10" font-weight="500">JWT</text>
  </g>
</svg>
