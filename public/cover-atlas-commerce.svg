<svg width="600" height="340" viewBox="0 0 600 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Cosmic Gradients -->
    <linearGradient id="ac_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061214"/>
      <stop offset="50%" stop-color="#0c2024"/>
      <stop offset="100%" stop-color="#050e10"/>
    </linearGradient>
    <linearGradient id="ac_card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#112d30" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#091b1d" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="ac_accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="ac_glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="600" height="340" fill="url(#ac_bg)"/>
  <rect width="600" height="340" fill="url(#ac_glow)"/>

  <!-- Subtle Commerce Matrix Grid Pattern -->
  <g opacity="0.08" stroke="#2dd4bf" stroke-width="1">
    <path d="M0 60 H600 M0 120 H600 M0 180 H600 M0 240 H600 M0 300 H600"/>
    <path d="M60 0 V340 M120 0 V340 M180 0 V340 M240 0 V340 M300 0 V340 M360 0 V340 M420 0 V340 M480 0 V340 M540 0 V340"/>
  </g>

  <!-- Central Commerce Architecture Canvas -->
  <rect x="120" y="52" width="360" height="236" rx="14" fill="url(#ac_card)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="1.5"/>

  <!-- Top Frame Bar -->
  <path d="M120 92 H480" stroke="rgba(45, 212, 191, 0.2)" stroke-width="1"/>
  <circle cx="145" cy="72" r="4" fill="#2dd4bf"/>
  <circle cx="160" cy="72" r="4" fill="#14b8a6"/>
  <circle cx="175" cy="72" r="4" fill="#a855f7"/>
  <rect x="360" y="67" width="100" height="10" rx="5" fill="rgba(45, 212, 191, 0.2)"/>

  <!-- Left: Geometric Commerce Bag & Checkout Engine Motif -->
  <g transform="translate(160, 116)">
    <!-- Stylized Geometric Shopping Bag Lines -->
    <path d="M30 30 C 30 14, 46 14, 46 30" stroke="#2dd4bf" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M14 30 H62 L68 95 H8 Z" fill="rgba(6, 78, 59, 0.35)" stroke="#2dd4bf" stroke-width="1.5"/>

    <!-- Bag Facets & Vector Lines -->
    <path d="M26 30 L22 95 M50 30 L54 95" stroke="rgba(45, 212, 191, 0.4)" stroke-width="1"/>
    
    <!-- Token Core -->
    <circle cx="38" cy="62" r="10" fill="rgba(20, 184, 166, 0.2)" stroke="#2dd4bf" stroke-width="1.5"/>
    <path d="M34 62 H42 M38 58 V66" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>

    <text x="38" y="112" text-anchor="middle" fill="#99f6e4" font-family="'Questrial', sans-serif" font-size="9" letter-spacing="0.04em">HEADLESS ENGINE</text>
  </g>

  <!-- Right: Modular Product Catalog & Multi-Store Grid -->
  <g transform="translate(280, 116)">
    <!-- 2x2 Geometric Catalog Tiles -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="80" height="42" rx="8" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(45, 212, 191, 0.25)" stroke-width="1"/>
      <rect x="8" y="10" width="22" height="22" rx="4" fill="rgba(45, 212, 191, 0.2)" stroke="#2dd4bf" stroke-width="0.8"/>
      <rect x="36" y="13" width="36" height="5" rx="2.5" fill="rgba(255, 255, 255, 0.6)"/>
      <rect x="36" y="24" width="24" height="4" rx="2" fill="#2dd4bf" opacity="0.8"/>
    </g>

    <g transform="translate(90, 0)">
      <rect x="0" y="0" width="80" height="42" rx="8" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(168, 85, 247, 0.25)" stroke-width="1"/>
      <rect x="8" y="10" width="22" height="22" rx="4" fill="rgba(168, 85, 247, 0.2)" stroke="#a855f7" stroke-width="0.8"/>
      <rect x="36" y="13" width="36" height="5" rx="2.5" fill="rgba(255, 255, 255, 0.6)"/>
      <rect x="36" y="24" width="24" height="4" rx="2" fill="#a855f7" opacity="0.8"/>
    </g>

    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="80" height="42" rx="8" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(168, 85, 247, 0.25)" stroke-width="1"/>
      <rect x="8" y="10" width="22" height="22" rx="4" fill="rgba(168, 85, 247, 0.2)" stroke="#a855f7" stroke-width="0.8"/>
      <rect x="36" y="13" width="36" height="5" rx="2.5" fill="rgba(255, 255, 255, 0.6)"/>
      <rect x="36" y="24" width="24" height="4" rx="2" fill="#a855f7" opacity="0.8"/>
    </g>

    <g transform="translate(90, 52)">
      <rect x="0" y="0" width="80" height="42" rx="8" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(45, 212, 191, 0.25)" stroke-width="1"/>
      <rect x="8" y="10" width="22" height="22" rx="4" fill="rgba(45, 212, 191, 0.2)" stroke="#2dd4bf" stroke-width="0.8"/>
      <rect x="36" y="13" width="36" height="5" rx="2.5" fill="rgba(255, 255, 255, 0.6)"/>
      <rect x="36" y="24" width="24" height="4" rx="2" fill="#2dd4bf" opacity="0.8"/>
    </g>

    <text x="85" y="112" text-anchor="middle" fill="#ccfbf1" font-family="'Questrial', sans-serif" font-size="9" letter-spacing="0.04em">PRISMA ORM &amp; POSTGRES</text>
  </g>

  <!-- Bottom Architecture Node Badges: NestJS / Vue 3 / Prisma / PostgreSQL -->
  <g transform="translate(150, 248)">
    <rect x="0" y="0" width="75" height="22" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(234, 88, 12, 0.35)" stroke-width="1"/>
    <circle cx="12" cy="11" r="3" fill="#ea580c"/>
    <text x="22" y="15" fill="#fed7aa" font-family="'Questrial', sans-serif" font-size="10" font-weight="500">NESTJS</text>

    <rect x="85" y="0" width="65" height="22" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(45, 212, 191, 0.35)" stroke-width="1"/>
    <circle cx="97" cy="11" r="3" fill="#2dd4bf"/>
    <text x="107" y="15" fill="#99f6e4" font-family="'Questrial', sans-serif" font-size="10" font-weight="500">VUE 3</text>

    <rect x="160" y="0" width="70" height="22" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1"/>
    <circle cx="172" cy="11" r="3" fill="#a855f7"/>
    <text x="182" y="15" fill="#e9d5ff" font-family="'Questrial', sans-serif" font-size="10" font-weight="500">PRISMA</text>

    <rect x="240" y="0" width="55" height="22" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1"/>
    <circle cx="252" cy="11" r="3" fill="#38bdf8"/>
    <text x="262" y="15" fill="#bae6fd" font-family="'Questrial', sans-serif" font-size="10" font-weight="500">REST</text>
  </g>
</svg>
