<svg width="600" height="340" viewBox="0 0 600 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wt_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07101f"/>
      <stop offset="50%" stop-color="#0e1d38"/>
      <stop offset="100%" stop-color="#050a14"/>
    </linearGradient>
    <linearGradient id="wt_card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15264a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0b1529" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="wt_wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <rect width="600" height="340" fill="url(#wt_bg)"/>

  <!-- Radar / Telemetry Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <circle cx="300" cy="170" r="110"/>
    <circle cx="300" cy="170" r="70"/>
    <line x1="300" y1="50" x2="300" y2="290"/>
    <line x1="180" y1="170" x2="420" y2="170"/>
  </g>

  <rect x="110" y="52" width="380" height="236" rx="14" fill="url(#wt_card)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>

  <path d="M110 92 H490" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
  <circle cx="135" cy="72" r="4" fill="#38bdf8"/>
  <circle cx="150" cy="72" r="4" fill="#818cf8"/>
  <circle cx="165" cy="72" r="4" fill="#2dd4bf"/>

  <!-- Telemetry Oscilloscope Wave & Solar Node Motif -->
  <g transform="translate(150, 116)">
    <rect x="0" y="0" width="300" height="96" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>

    <!-- Wave 1 -->
    <path d="M20 50 Q 60 15, 100 50 T 180 50 T 260 50 T 280 50" stroke="url(#wt_wave)" stroke-width="2.5" fill="none"/>
    <path d="M20 62 Q 60 38, 100 62 T 180 62 T 260 62 T 280 62" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>

    <!-- Telemetry Pins -->
    <circle cx="60" cy="32" r="4" fill="#38bdf8"/>
    <circle cx="140" cy="32" r="4" fill="#818cf8"/>
    <circle cx="220" cy="32" r="4" fill="#2dd4bf"/>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(170, 250)">
    <rect x="0" y="0" width="80" height="22" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1"/>
    <text x="40" y="15" text-anchor="middle" fill="#bae6fd" font-family="'Questrial', sans-serif" font-size="10" font-weight="500">TELEMETRY</text>

    <rect x="90" y="0" width="75" height="22" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(129, 140, 248, 0.35)" stroke-width="1"/>
    <text x="127" y="15" text-anchor="middle" fill="#e0e7ff" font-family="'Questrial', sans-serif" font-size="10" font-weight="500">WEATHER</text>

    <rect x="175" y="0" width="65" height="22" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(45, 212, 191, 0.35)" stroke-width="1"/>
    <text x="207" y="15" text-anchor="middle" fill="#99f6e4" font-family="'Questrial', sans-serif" font-size="10" font-weight="500">SIGNALS</text>
  </g>
</svg>
